name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: iphone-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Regenerate iOS template (generates Podfile + podhelper)
        working-directory: iphone-app
        run: flutter create --platforms=ios .

      - name: Restore our customized files (deps, bluetooth plist, entitlements)
        working-directory: iphone-app
        run: |
          git checkout -- pubspec.yaml
          git checkout -- ios/Runner/Info.plist
          git checkout -- ios/Runner/Runner.entitlements

      - name: Flutter pub get
        run: flutter pub get

      - name: Create self-signed iPhone Developer cert (only to pass Flutter's sign check; app stays unsigned)
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          openssl genrsa -out /tmp/key.pem 2048
          openssl req -new -key /tmp/key.pem -out /tmp/req.csr -subj "/CN=Flutter Build/OU=iPhone Developer"
          printf "basicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\nextendedKeyUsage=critical,codeSigning\n" > /tmp/ext.cnf
          openssl x509 -req -in /tmp/req.csr -signkey /tmp/key.pem -out /tmp/cert.pem -days 365 -extfile /tmp/ext.cnf
          security import /tmp/key.pem -k build.keychain -T /usr/bin/codesign -T /usr/bin/security -P ""
          security import /tmp/cert.pem -k build.keychain -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security find-identity -v -p codesigning

      - name: Build unsigned Release app
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
        run: flutter build ios --release --build-number=$GITHUB_RUN_NUMBER

      - name: Package IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r "$GITHUB_WORKSPACE/swatch-health-unsigned.ipa" Payload
        working-directory: iphone-app

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: swatch-health-unsigned-ipa
          path: swatch-health-unsigned.ipa
